<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">Smart Flood Detection System Block Diagram</title>
  <desc id="desc">Block diagram showing power, water sensor, ESP32, local alarm, WiFi, Telegram, phone notification, and USB serial diagnostics.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#263238"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #102027; }
      .subtitle { font: 16px Arial, sans-serif; fill: #455a64; }
      .box { fill: #ffffff; stroke: #263238; stroke-width: 2.5; rx: 8; }
      .sensor { fill: #e3f2fd; }
      .controller { fill: #e8f5e9; }
      .alert { fill: #fff3e0; }
      .network { fill: #f3e5f5; }
      .power { fill: #fbe9e7; }
      .text { font: 700 18px Arial, sans-serif; fill: #102027; }
      .small { font: 14px Arial, sans-serif; fill: #37474f; }
      .line { stroke: #263238; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect width="1180" height="720" fill="#fafafa"/>
  <text x="590" y="48" text-anchor="middle" class="title">Smart Flood Detection System</text>
  <text x="590" y="78" text-anchor="middle" class="subtitle">Local-first ESP32 flood alarm with optional Telegram push notification</text>

  <rect x="70" y="138" width="220" height="96" class="box power"/>
  <text x="180" y="174" text-anchor="middle" class="text">5 V USB Power</text>
  <text x="180" y="202" text-anchor="middle" class="small">Wall adapter + optional UPS</text>

  <rect x="70" y="310" width="220" height="104" class="box sensor"/>
  <text x="180" y="348" text-anchor="middle" class="text">Water Sensor</text>
  <text x="180" y="376" text-anchor="middle" class="small">Analog output</text>
  <text x="180" y="398" text-anchor="middle" class="small">GPIO34 / ADC1_CH6</text>

  <rect x="398" y="250" width="260" height="170" class="box controller"/>
  <text x="528" y="292" text-anchor="middle" class="text">ESP32 Firmware</text>
  <text x="528" y="326" text-anchor="middle" class="small">ADC sampling + debounce</text>
  <text x="528" y="350" text-anchor="middle" class="small">Event log ring buffer</text>
  <text x="528" y="374" text-anchor="middle" class="small">Independent FreeRTOS queues</text>

  <rect x="398" y="515" width="260" height="96" class="box"/>
  <text x="528" y="552" text-anchor="middle" class="text">USB Serial</text>
  <text x="528" y="580" text-anchor="middle" class="small">Calibration + log dump</text>

  <rect x="770" y="140" width="230" height="104" class="box alert"/>
  <text x="885" y="178" text-anchor="middle" class="text">Local Alarm</text>
  <text x="885" y="206" text-anchor="middle" class="small">GPIO25 buzzer</text>
  <text x="885" y="228" text-anchor="middle" class="small">GPIO26 status LED</text>

  <rect x="770" y="320" width="230" height="96" class="box network"/>
  <text x="885" y="356" text-anchor="middle" class="text">WiFi Router</text>
  <text x="885" y="384" text-anchor="middle" class="small">Reconnects after dropouts</text>

  <rect x="770" y="510" width="230" height="96" class="box network"/>
  <text x="885" y="546" text-anchor="middle" class="text">Telegram API</text>
  <text x="885" y="574" text-anchor="middle" class="small">HTTPS push alert</text>

  <rect x="1025" y="510" width="110" height="96" class="box alert"/>
  <text x="1080" y="548" text-anchor="middle" class="text">Phone</text>
  <text x="1080" y="576" text-anchor="middle" class="small">Notification</text>

  <path d="M290 186 H398" class="line"/>
  <path d="M290 362 H398" class="line"/>
  <path d="M658 300 H770" class="line"/>
  <path d="M658 366 H770" class="line dash"/>
  <path d="M885 416 V510" class="line"/>
  <path d="M1000 558 H1025" class="line"/>
  <path d="M528 420 V515" class="line"/>

  <text x="714" y="284" text-anchor="middle" class="small">local queue first</text>
  <text x="714" y="352" text-anchor="middle" class="small">remote queue if connected</text>
  <text x="344" y="174" text-anchor="middle" class="small">5 V / 3.3 V regulated</text>
  <text x="344" y="348" text-anchor="middle" class="small">raw ADC</text>
</svg>

