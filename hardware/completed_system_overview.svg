<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Completed Smart Flood Detection System</title>
  <desc id="desc">Assembly drawing showing the ESP32 C3 Mini, custom carrier PCB, Seeed Grove water level sensor, buzzer, status LED, resistor, and Grove cable.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#1f2933"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #17212b; }
      .label { font-size: 23px; font-weight: 700; }
      .small { font-size: 18px; }
      .line { stroke: #1976d2; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .wireBlack { stroke: #1f2933; stroke-width: 8; fill: none; stroke-linecap: round; }
      .wireYellow { stroke: #f9c74f; stroke-width: 8; fill: none; stroke-linecap: round; }
      .wireRed { stroke: #ef4444; stroke-width: 8; fill: none; stroke-linecap: round; }
      .wireWhite { stroke: #f8fafc; stroke-width: 8; fill: none; stroke-linecap: round; }
    </style>
  </defs>

